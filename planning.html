<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:17px/1.4 Roboto, -apple-system, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; }
  header .tt { display:flex; flex-direction:column; line-height:1.15; flex:1; }
  header .dt { display:flex; flex-direction:column; align-items:flex-end; line-height:1.2; }
  .tabs { position:sticky; top:0; z-index:5; overflow-x:auto; }
  .tabs .seg { display:flex; }
  .tabs button { white-space:nowrap; cursor:pointer; }
  main { max-width:900px; margin:0 auto; padding:4px 16px 50px; }
  .res { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 4px; }
  .res div { background:#fff; border-radius:14px; padding:10px 16px; flex:1; min-width:130px; }
  .res b { display:block; font-family:Oswald, sans-serif; font-weight:700; font-size:34px; line-height:1; }
  .res span { font-size:13px; color:#5c5c5c; }
  .res .r b { color:var(--red); }
  .grp { background:var(--ink); color:#fff; font-family:Oswald, sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:1px; font-size:16px; padding:8px 14px; border-radius:10px 10px 0 0; margin-top:18px; display:flex; justify-content:space-between; }
  .lst { background:#fff; border-radius:0 0 12px 12px; overflow:hidden; }
  .ln { display:grid; grid-template-columns:minmax(120px,1.1fr) minmax(110px,.9fr) 2fr; gap:12px; align-items:center; padding:9px 14px; border-top:1px solid var(--line); }
  .ln:first-child { border-top:0; }
  .ln .n { font-weight:700; display:flex; align-items:center; gap:6px; min-width:0; }
  .ln .n .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ln .n .ec { flex:none; font-size:11px; font-weight:700; border-radius:6px; padding:1px 5px; background:#eee; color:#555; font-variant-numeric:tabular-nums; }
  .ln .n .ec.p { background:#fdebee; color:#c4001f; } .ln .n .ec.m { background:#e6f4ea; color:#137a37; }
  .ln .h { font-variant-numeric:tabular-nums; font-size:15px; }
  .ln .h i { font-style:normal; font-size:11px; font-weight:700; text-transform:uppercase; background:#fff3d6; color:#7a4d00; border-radius:6px; padding:1px 6px; margin-right:4px; }
  .ln.off { opacity:.42; }
  .ln .n.cl { cursor:pointer; } .ln .n.cl .nm { text-decoration:underline dotted; text-underline-offset:4px; }
  .ln .n.cl .nm::after { content:" ☎"; font-size:13px; color:var(--red); }
  .ln .tel { grid-column:1 / -1; display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:#fff3f5; border-radius:10px; padding:8px 12px; }
  .ln .tel a { font-family:Oswald, sans-serif; font-weight:700; font-size:26px; color:var(--red); text-decoration:none; letter-spacing:1px; }
  .ln .tel span { font-size:13px; color:#5c5c5c; }

  .ln.on .n::before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:#137a37; margin-right:7px; vertical-align:1px; }
  .tl { position:relative; height:16px; background:#f0f0f0; border-radius:8px; }
  .tl span { position:absolute; top:0; bottom:0; background:var(--red); border-radius:8px; }
  .tl span.e { background:var(--ink); }
  .tl span.s { background:#d9a400; }
  .tl .now { position:absolute; top:-4px; bottom:-4px; width:2px; background:#137a37; }
  .axe { display:grid; grid-template-columns:minmax(120px,1.1fr) minmax(110px,.9fr) 2fr; gap:12px; padding:4px 14px 0; font-size:12px; color:#5c5c5c; }
  .axe div:last-child { display:flex; justify-content:space-between; }
  .tl span b { position:absolute; left:50%; top:50%; transform:translate(-50%,-52%); color:#fff; font:900 15px/1 Roboto, sans-serif; letter-spacing:-1px; }
  .notes .frm { background:#fff; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .notes .rw { display:flex; gap:10px; flex-wrap:wrap; }
  .notes label { flex:1; min-width:180px; font-size:13px; color:#5c5c5c; font-weight:700; display:flex; flex-direction:column; gap:4px; }
  .notes select, .notes textarea { font:inherit; font-size:17px; padding:10px 12px; border:2px solid #d0d0d0; border-radius:12px; background:#fff; color:var(--ink); width:100%; }
  .notes textarea { min-height:70px; resize:vertical; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chips button { font:inherit; font-size:15px; font-weight:700; border:2px solid #d0d0d0; background:#fff; border-radius:22px; padding:8px 14px; cursor:pointer; color:var(--ink); }
  .chips button[aria-pressed=true] { background:var(--red); border-color:var(--red); color:#fff; }
  .notes .go { align-self:flex-end; font:inherit; font-weight:700; font-size:17px; background:var(--red); color:#fff; border:0; border-radius:28px; padding:12px 28px; cursor:pointer; }
  .notes .msg { font-size:14px; color:var(--red); min-height:1em; }
  .nl { background:#fff; border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:10px; align-items:flex-start; }
  .nl .c { flex:1; min-width:0; }
  .nl .c b { margin-right:6px; }
  .nl .t { display:inline-block; font-size:12px; font-weight:700; text-transform:uppercase; background:var(--ink); color:#fff; border-radius:6px; padding:1px 7px; margin-right:6px; vertical-align:1px; }
  .nl .p { font-size:13px; color:#5c5c5c; margin-top:2px; }
  .nl.att { opacity:.55; }
  .nl .x { font:inherit; border:0; background:none; color:#5c5c5c; font-size:20px; cursor:pointer; padding:0 4px; }
  .notes .fin { background:#fff; border-radius:0 0 12px 12px; height:8px; }
  .vide, .err { background:#fff; border-radius:12px; padding:22px; margin-top:18px; text-align:center; color:#5c5c5c; }
  .err { color:var(--red); }
  .maj { font-size:13px; color:#5c5c5c; margin-top:18px; text-align:center; }
  @media (max-width:600px) { .ln, .axe { grid-template-columns:1fr 1fr; } .ln .tl, .axe div:last-child { grid-column:1 / -1; } .axe div:nth-child(-n+2) { display:none; } }
</style>

<body data-app="planning">
<header>
  <img alt="KFC" src="logo.png">
  <div class="tt"><b>Planning</b><span>Équipe du jour · KFC Toulouse Borderouge</span></div>
  <div class="dt"><b id="h-heure"></b><span id="h-date"></span></div>
</header>
<div class="stripes"></div>
<nav class="tabs"><div class="seg" id="tabs"></div></nav>
<main><div id="main"><div class="vide">Chargement…</div></div><section class="notes" id="notes"></section></main>
<script>
(function () {
  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var T0 = 8 * 60, T1 = 26 * 60, D = null, SEL = null, TELO = null;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function auj() { return iso(new Date(Date.now() - 5 * 3600000)); } // après minuit, on reste sur la journée de la veille jusqu'à 5 h
  function dt(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function hm(t) { var p = String(t).split(':'); var h = +p[0], m = +p[1] || 0; return (h < 6 ? h + 24 : h) * 60 + m; }
  function segs(h) { var out = []; String(h || '').split('/').forEach(function (s) { var m = s.match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/); if (!m) return; var a = hm(m[1] + ':' + m[2]), z = hm(m[3] + ':' + m[4]); if (z <= a) z += 1440; out.push([a, z]); }); return out; }
  function hTxt(h) { return String(h || '').replace(/(\d{1,2}):(\d{2})/g, function (_, a, b) { return +a + 'h' + (b === '00' ? '' : b); }); }
  function nowM() { var d = new Date(), m = d.getHours() * 60 + d.getMinutes(); return m < 5 * 60 ? m + 1440 : m; }
  function labJour(s) { var t = auj(), d = dt(s); if (s === t) return "Aujourd'hui"; var dm = dt(t); dm.setDate(dm.getDate() + 1); if (s === iso(dm)) return 'Demain'; return JOURS[d.getDay()].slice(0, 3) + '. ' + d.getDate(); }
  function horloge() { var d = new Date(); document.getElementById('h-heure').textContent = d.getHours() + 'h' + pad(d.getMinutes()); document.getElementById('h-date').textContent = JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()]; }

  function onglets() {
    var t = auj(), dates = [];
    D.rows.forEach(function (r) { if (r.date >= t && dates.indexOf(r.date) < 0) dates.push(r.date); });
    dates.sort(); if (dates.indexOf(t) < 0) dates.unshift(t);
    if (!SEL || dates.indexOf(SEL) < 0) SEL = t;
    var box = document.getElementById('tabs'); box.innerHTML = '';
    dates.slice(0, 7).forEach(function (d) { var b = el('button', '', labJour(d)); b.type = 'button'; b.setAttribute('aria-selected', String(d === SEL)); b.onclick = function () { SEL = d; TELO = null; onglets(); rendre(); notes(); }; box.append(b); });
  }

  function ligne(r, isT, nm) {
    var S = segs(r.h), syn = r.statut === 'Synergy', pres = isT && !syn && S.some(function (s) { return nm >= s[0] && nm < s[1]; });
    var ln = el('div', 'ln' + (isT ? (pres ? ' on' : ' off') : ''));
    var nm0 = el('div', 'n'); nm0.append(el('span', 'nm', r.nom)); ln.append(nm0);
    var EC = D.infos && D.infos.ecarts; if (r.type !== 'enca' && EC && EC.m && EC.m[r.nom] != null) { var em = EC.m[r.nom], a0 = Math.abs(em);
      var ep = el('span', 'ec' + (em > 0 ? ' p' : em < 0 ? ' m' : ''), (em > 0 ? '+' : em < 0 ? '−' : '') + (a0 < 60 ? a0 + ' min' : Math.floor(a0 / 60) + 'h' + String(a0 % 60).padStart(2, '0')));
      ep.title = 'Écart heures pointées − planning depuis lundi, au ' + EC.au.slice(8) + '/' + EC.au.slice(5, 7); nm0.append(ep); }
    if (isT && r.tel) { nm0.classList.add('cl'); nm0.title = 'Voir le numéro'; ln.onclick = function () { TELO = TELO === r.nom ? null : r.nom; rendre(); }; }
    var h = el('div', 'h'); if (syn) h.append(el('i', '', 'Synergy')); h.append(hTxt(r.h)); ln.append(h);
    var tl = el('div', 'tl');
    S.forEach(function (s) { var sp = el('span', r.type === 'enca' ? 'e' : syn ? 's' : ''); var x0 = Math.max(0, (s[0] - T0) / (T1 - T0)), x1 = Math.min(1, (s[1] - T0) / (T1 - T0)); sp.style.left = (x0 * 100) + '%'; sp.style.width = (Math.max(.01, x1 - x0) * 100) + '%'; if (r.type !== 'enca' && s[1] - s[0] > 300) { sp.append(el('b', '', '//')); sp.title = 'Pause de 30 min (shift de plus de 5 h)'; } tl.append(sp); });
    if (isT && nm >= T0 && nm <= T1) { var n = el('i', 'now'); n.style.left = ((nm - T0) / (T1 - T0) * 100) + '%'; tl.append(n); }
    ln.append(tl);
    if (isT && r.tel && TELO === r.nom) { var tz = el('div', 'tel'), a = el('a', '', (function (t) { var d = t.replace(/\D/g, ''); return d.length === 10 ? d.replace(/(\d\d)(?=\d)/g, '$1 ') : t; })(r.tel)); a.href = 'tel:' + r.tel.replace(/[^\d+]/g, ''); a.onclick = function (e) { e.stopPropagation(); };
      tz.append(a, el('span', '', 'Touche le numéro pour appeler')); ln.append(tz); ln.classList.remove('off'); }
    return { ln: ln, pres: pres };
  }

  function groupe(main, titre, L, isT, nm) {
    if (!L.length) return 0;
    var g = el('div', 'grp'); g.append(el('span', '', titre), el('span', '', L.length)); main.append(g);
    var ax = el('div', 'axe'); ax.append(el('div'), el('div')); var a3 = el('div'); ['8h', '12h', '16h', '20h', '0h', '2h'].forEach(function (x) { a3.append(el('span', '', x)); }); ax.append(a3); main.append(ax);
    var lst = el('div', 'lst'), np = 0;
    L.forEach(function (r) { var x = ligne(r, isT, nm); if (x.pres) np++; lst.append(x.ln); });
    main.append(lst); return np;
  }

  function rendre() {
    var main = document.getElementById('main'); main.innerHTML = '';
    if (!D) return;
    var isT = SEL === auj(), nm = nowM();
    var J = D.rows.filter(function (r) { return r.date === SEL; });
    var trav = J.filter(function (r) { return r.statut === 'travail' || r.statut === 'Synergy'; }).sort(function (a, b) { var x = segs(a.h)[0], y = segs(b.h)[0]; return (x ? x[0] : 9999) - (y ? y[0] : 9999) || a.nom.localeCompare(b.nom); });
    var E = trav.filter(function (r) { return r.type === 'enca'; }), S = trav.filter(function (r) { return r.type !== 'enca'; });
    if (!trav.length) { main.append(el('div', 'vide', D.rows.length ? 'Pas de planning pour ce jour.' : "Le planning n'a pas encore été envoyé par le TDB.")); }
    else {
      var open = E.filter(function (r) { var s = segs(r.h)[0]; return s && s[0] <= 8 * 60; }), close = E.filter(function (r) { var s = segs(r.h); return s.length && s[s.length - 1][1] >= 24 * 60; });
      var res = el('div', 'res');
      var c1 = el('div'); c1.append(el('b', '', trav.length), el('span', '', 'personnes au planning')); res.append(c1);
      var c2 = el('div', 'r'); c2.append(el('b', '', '–'), el('span', '', 'sur le terrain maintenant')); if (isT) res.append(c2);
      var c3 = el('div'); c3.append(el('b', '', open.map(function (r) { return r.nom; }).join(', ') || '—'), el('span', '', 'open')); c3.firstChild.style.fontSize = '24px'; res.append(c3);
      var c4 = el('div'); c4.append(el('b', '', close.map(function (r) { return r.nom; }).join(', ') || '—'), el('span', '', 'close')); c4.firstChild.style.fontSize = '24px'; res.append(c4);
      main.append(res);
      var np = groupe(main, 'Encadrants', E, isT, nm) + groupe(main, 'Équipiers', S, isT, nm);
      if (isT) c2.firstChild.textContent = np;
    }
    main.append(el('div', 'maj', D.maj ? 'Planning envoyé par le TDB le ' + D.maj + (isT ? ' · les personnes pas sur le terrain à cette heure sont grisées' : '') + ' · // = pause à prendre (shift de plus de 5 h)' + (D.infos && D.infos.ecarts ? ' · à côté du nom : heures pointées − planning depuis lundi, au ' + D.infos.ecarts.au.slice(8) + '/' + D.infos.ecarts.au.slice(5, 7) + ' (rouge = plus que prévu)' : '') : ''));
  }


  // ===== Notes de la journée (encadrants) → onglet « Notes journée » du Sheet CLO LENBOR =====
  var TYPES = ['Absent', 'Pas venu, pas de nouvelles', 'Retard', 'Parti plus tôt', 'Échange', 'Autre'], NT = { type: '', nom: '', com: '' };
  function auteurs() { var L = []; (D ? D.rows : []).forEach(function (r) { if (r.type === 'enca' && L.indexOf(r.nom) < 0) L.push(r.nom); }); return L.sort(); }
  function gens() { var J = D.rows.filter(function (r) { return r.date === SEL; }), L = [];
    (J.length ? J : D.rows).forEach(function (r) { if (L.indexOf(r.nom) < 0) L.push(r.nom); }); return L.sort(function (a, b) { return a.localeCompare(b); }); }
  function notes() {
    var box = document.getElementById('notes'); if (!D) return;
    var ae = document.activeElement, fo = ae && box.contains(ae) && /^(TEXTAREA|SELECT)$/.test(ae.tagName) && !notes.force;
    var ta0 = notes.force ? null : box.querySelector('textarea'); if (ta0) NT.com = ta0.value; var se0 = notes.force ? null : box.querySelector('#n-nom'); if (se0) NT.nom = se0.value; var sa0 = box.querySelector('#n-aut'); if (sa0 && sa0.value) NT.aut = sa0.value;
    if (fo) { notes.pend = true; return; } // on ne redessine pas pendant la saisie (refait à la sortie du champ)
    notes.pend = false;
    box.innerHTML = '';
    var L = (D.notes || []).filter(function (n) { return n.date === SEL; });
    var g = el('div', 'grp'); g.append(el('span', '', 'Notes de la journée'), el('span', '', L.length || '')); box.append(g);
    var f = el('div', 'frm'), rw = el('div', 'rw');
    var la = el('label', '', 'Encadrant'), sa = el('select'); sa.id = 'n-aut'; sa.append(new Option('— Ton nom —', ''));
    var A = auteurs(), moi = ''; try { moi = localStorage.getItem('br_note_auteur') || ''; } catch (e) {}
    if (moi && A.indexOf(moi) < 0) A.push(moi); A.forEach(function (n) { sa.append(new Option(n, n)); }); if (NT.aut && A.indexOf(NT.aut) < 0) sa.append(new Option(NT.aut, NT.aut)); sa.value = NT.aut || moi; la.append(sa);
    var lb = el('label', '', 'Salarié concerné'), sb = el('select'); sb.id = 'n-nom'; sb.append(new Option('— Général (pas une personne) —', ''));
    gens().forEach(function (n) { sb.append(new Option(n, n)); }); sb.value = NT.nom; lb.append(sb);
    rw.append(la, lb); f.append(rw);
    var ch = el('div', 'chips'); TYPES.forEach(function (t) { var b = el('button', '', t); b.type = 'button'; b.setAttribute('aria-pressed', String(NT.type === t)); b.onclick = function () { NT.type = NT.type === t ? '' : t; ch.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.textContent === NT.type)); }); }; ch.append(b); }); f.append(ch);
    var ta = el('textarea'); ta.placeholder = 'Ex. : absent à cause de…, pas venu et pas de nouvelles, arrivé à 11 h 20…'; ta.value = NT.com; f.append(ta);
    [ta, sa, sb].forEach(function (x) { x.addEventListener('blur', function () { setTimeout(function () { if (notes.pend) notes(); }, 250); }); });
    var msg = el('div', 'msg'), go = el('button', 'go', 'Enregistrer'); go.type = 'button';
    go.onclick = function () {
      var n = { date: SEL, auteur: sa.value, nom: sb.value, type: NT.type, com: ta.value.trim(), id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
      if (!n.auteur) { msg.textContent = 'Choisis ton nom.'; sa.focus(); return; }
      if (!n.type && !n.com) { msg.textContent = 'Choisis un type ou écris un commentaire.'; return; }
      try { localStorage.setItem('br_note_auteur', n.auteur); } catch (e) {}
      var d = new Date(); n.quand = pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); n.att = true;
      D.notes = (D.notes || []).concat([n]); NT = { type: '', nom: '', com: '', aut: n.auteur }; notes.force = true; notes(); notes.force = false;
      BR.srv('formation', 'enregistrerNote', n).then(function () { n.att = false; BR.majCache('formation', 'getPlanning', D); notes(); })
        .catch(function (e) { D.notes = D.notes.filter(function (x) { return x !== n; }); NT = { type: n.type, nom: n.nom, com: n.com }; notes(); var m = document.querySelector('#notes .msg'); if (m) m.textContent = 'Pas enregistré : ' + e.message + '. Réessaie.'; });
    };
    var bas = el('div', 'rw'); bas.style.justifyContent = 'space-between'; bas.style.alignItems = 'center'; bas.append(msg, go); f.append(bas);
    box.append(f);
    L.slice().reverse().forEach(function (n) {
      var r = el('div', 'nl' + (n.att ? ' att' : '')), c = el('div', 'c');
      if (n.type) c.append(el('span', 't', n.type)); if (n.nom) c.append(el('b', '', n.nom)); if (n.com) c.append(document.createTextNode(n.com));
      c.append(el('div', 'p', 'par ' + n.auteur + ' · ' + (n.att ? 'envoi…' : n.quand)));
      r.append(c);
      if (!n.att) { var x = el('button', 'x', '✕'); x.type = 'button'; x.title = 'Supprimer cette note';
        x.onclick = function () { if (!confirm('Supprimer cette note ?')) return; r.classList.add('att');
          BR.srv('formation', 'supprimerNote', { id: n.id }).then(function () { D.notes = D.notes.filter(function (y) { return y !== n; }); BR.majCache('formation', 'getPlanning', D); notes(); })
            .catch(function (e) { r.classList.remove('att'); alert('Pas supprimé : ' + e.message); }); };
        r.append(x); }
      box.append(r);
    });
    box.append(el('div', 'fin'));
  }
  function afficher(d) { var loc = D && D.notes ? D.notes.filter(function (n) { return n.att; }) : []; D = d || { rows: [] }; D.notes = (D.notes || []).concat(loc); onglets(); rendre(); notes(); }
  horloge();
  BR.charge('formation', 'getPlanning', afficher, afficher).catch(function (e) {
    if (D) return; var m = document.getElementById('main'); m.innerHTML = '';
