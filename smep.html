  @media (max-width:700px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .task .row{flex-wrap:wrap} .rec{grid-template-columns:minmax(0,1fr) 60px 100px} .rec > :nth-child(4){display:none} }
  /* ---------- Impression (A4 paysage, mise en page du fichier SMEP) ---------- */

<body data-app="smep">
<header>
  <img alt="KFC" src="logo.png">
  <div class="tt"><b>SMEP</b><span>Maintenance et entretien préventif · KFC Toulouse Borderouge</span></div>
  <div class="dt"><b id="h-date"></b><span id="h-sem"></span><span id="sync" class="sync"></span></div>
</header>
<div class="stripes"></div>
<nav class="tabs"><div class="seg" id="tabs">
  <button type="button" data-t="todo" aria-selected="true">À faire</button>
  <button type="button" data-t="cal" aria-selected="false">Calendrier</button>
  <button type="button" data-t="ano" aria-selected="false">Points non OK<span class="badge hidden" id="b-ano"></span></button>
  <button type="button" data-t="spe" aria-selected="false">Contrôles spéciaux</button>

</div></nav>
<main>
  <div id="load" class="msg inf">Chargement…</div>
  <div id="v-todo" class="hidden"></div>
  <div id="v-cal" class="hidden"></div>
  <div id="v-ano" class="hidden"></div>
  <div id="v-spe" class="hidden"></div>
  <div id="v-rou" class="hidden"></div>
</main>

<script>
var D = null, VIEW = 'todo', BUSY = false;
var UI = { todoF: 'H', showDone: {}, koOpen: {}, calM: null, calV: 'H', calSel: null, anoF: 'open', anoP: 3, speV: null, aire: {}, font: {}, fontCom: '', fontTech: '' };
var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
var $ = function (id) { return document.getElementById(id); };

function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function btn(cls, txt, fn) { var b = el('button', cls, txt); b.type = 'button'; if (fn) b.onclick = fn; return b; }
function srv(fn, arg) { return BR.srv('smep', fn, arg); }
function toast(t) { var x = $('toast'); x.textContent = t; x.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(function () { x.classList.add('hidden'); }, 2600); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dt(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function isoD(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fr(iso) { var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : iso; }
function semaine(d) {
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), j = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - j);
  var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return t.getUTCFullYear() + '-W' + pad(Math.ceil(((t - y0) / 86400000 + 1) / 7));
}
function periode(f, iso) {
  var p = iso.split('-');
  if (f === 'H' || f === 'B') return semaine(dt(iso));
  if (f === 'Q') return p[0] + '-' + p[1] + (+p[2] <= 15 ? '-Q1' : '-Q2');
  return p[0] + '-' + p[1];
}
function lundi(d) { var x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function quiObj() { try { var i = localStorage.getItem('smep_qui'); return i !== null && D.equipe[+i] ? D.equipe[+i] : null; } catch (e) { return null; } }

/* ---------- État d'une tâche sur une période ---------- */
function lignes(code, per) {
  return D.rows.filter(function (r) { return r.code === code && (per == null || r.p === per); }).sort(function (a, b) { return a.ts < b.ts ? -1 : 1; });
}
function bon(r) { return r.res === 'OK' || r.st === 'Corrigé'; }
function etat(task, per) {
  var L = lignes(task.code, per), last = L[L.length - 1] || null;
  var need = task.f === 'B' ? 2 : 1, nb = L.filter(bon).length;
  return { L: L, last: last, nb: nb, need: need, done: nb >= need, ko: !!(last && last.res === 'Pas OK' && last.st !== 'Corrigé'), wait: !!(last && last.st === 'En attente technicien') };
}
function tasksOf(f) {
  if (f === 'R') { var m = dt(D.today).getMonth() + 1; return D.rec.filter(function (r) { return r.mois.indexOf(m) >= 0; }); }
  return D.cat[f];
}
function ouverts() { return D.rows.filter(function (r) { return r.res === 'Pas OK' && r.st !== 'Corrigé'; }); }

/* ---------- Chargement ---------- */
function charger(d) {
  D = d;
  $('load').classList.add('hidden');
  var t = dt(D.today);
  $('h-date').textContent = JOURS[t.getDay()].replace(/^./, function (c) { return c.toUpperCase(); }) + ' ' + t.getDate() + ' ' + MOIS[t.getMonth()];
  $('h-sem').textContent = 'Semaine ' + (+semaine(t).split('W')[1]) + ' · ' + MOIS[t.getMonth()] + ' ' + t.getFullYear();
  if (!UI.calM) UI.calM = { y: t.getFullYear(), m: t.getMonth() };
  majBadge(); etatSync();
  rendre();
}
function rendre() {
  ['todo', 'cal', 'ano', 'spe', 'rou'].forEach(function (v) { $('v-' + v).classList.toggle('hidden', v !== VIEW); });
  document.querySelectorAll('#tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.t === VIEW ? 'true' : 'false'); });
  ({ todo: rTodo, cal: rCal, ano: rAno, spe: rSpe, rou: rRou })[VIEW]();
}
document.querySelectorAll('#tabs button').forEach(function (b) { b.onclick = function () { VIEW = b.dataset.t; if (VIEW === 'spe') UI.speV = null; rendre(); window.scrollTo(0, 0); }; });

/* Les saisies s'affichent tout de suite ; l'envoi au Google Sheet se fait derrière, dans l'ordre. */
var LIB_F = { B: '2 fois par semaine', H: 'Hebdomadaire', Q: '2 fois par mois', M: 'Mensuel', A: 'Aire de jeux (mensuel)', R: 'Récurrente' };
var FILE = Promise.resolve(), ENCOURS = 0;
function envoi(fn, siEchec) {

/* ---------- Impression : mise en page du fichier SMEP ---------- */
function blocsPrint(list) {
  var out = [], i = 0;
  while (i < list.length) {
    var j = i; while (j + 1 < list.length && list[j + 1].app === list[i].app) j++;
    if (j > i) { out.push({ head: list[i].app }); for (var k = i; k <= j; k++) out.push({ task: list[k], label: list[k].t }); }
    else out.push({ task: list[i], label: list[i].t, pre: list[i].app + ' : ' });
    i = j + 1;
  }
  return out;
}
function ligneP(r, bg, extra) {
  var d = el('div', 'l'); d.style.background = bg;
  var t = el('span', 't');
  if (r.head) t.append(el('b', '', r.head)); else { if (r.pre) t.append(el('b', '', r.pre)); t.append(document.createTextNode(r.label)); }
  d.append(t); if (extra !== false) d.append(el('span', 'n', r.task && r.task.n ? r.task.n : ''));
  return d;
}
function slotP(r, bg) { var s = el('span'); s.style.background = bg; if (r) { var c = r.res !== 'OK' && r.st === 'Corrigé'; s.textContent = (r.res === 'OK' ? '' : c ? '✗→✓ ' : '✗ ') + fr(r.d) + ' ' + r.ini; if (r.res !== 'OK') s.className = c ? 'corr' : 'ko'; } return s; }
function blocP(titre, col, c1, c2, tasks, cols, ym) {

  var hb = el('div', 'hd'); hb.style.background = col; hb.append(el('i', 'c', 'Date & Initiales')); b.append(hb);
  var k = 0;
  blocsPrint(tasks).forEach(function (r) {
    if (r.head || r.pre) k++;
    var bg = k % 2 ? c1 : c2;

    var sl = el('div', 'sl');
    cols.forEach(function (c) { sl.append(slotP(r.task ? lignes(r.task.code, c.p).slice(-1)[0] : null, bg)); });
    b.append(sl);

  var p = el('div', 'pr'); p.append(a, b); return p;
}
